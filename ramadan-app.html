<body>
<div class="app">
<header><div class="brand"><div class="brand-icon">✓</div> Pro plan</div><div class="avatar">Р</div></header>
<main>
<section class="view active" id="todayView">
<div class="heading"><p id="greeting" class="muted"></p><h1>Сегодня</h1></div>

</section>
<section class="view" id="habitsView">
<div class="heading"><p class="muted">Маленькие шаги каждый день</p><h1>Привычки</h1></div>
<div class="panel"><div class="panel-head"><h2>На выбранный день</h2><button class="primary" id="addHabit">＋ Добавить</button></div><div id="habitList"></div></div>
</section>
</main></div>
<nav class="bottom-nav">
<button class="nav-button active" data-view="todayView"><span class="nav-icon"><span class="nav-badge"><strong id="todayNavDate" class="nav-badge-date"></strong></span></span><span>Сегодня</span></button>
<button class="nav-button" data-view="calendarView"><span class="nav-icon"><span class="nav-badge"><span class="nav-badge-grid"><i></i><i></i><i></i><i></i></span></span></span><span>Календарь</span></button>
<button class="nav-button" data-view="habitsView"><span class="nav-icon"><span class="nav-badge"><span class="nav-badge-check">✓</span></span></span><span>Привычки</span></button>

<div class="backdrop" id="taskModal"><form class="modal" id="taskForm">
<div class="modal-head"><h2 id="modalTitle">Новая задача</h2><div class="modal-head-actions"><div class="priority-flag" id="priorityFlagWrap" title="Приоритет"><span class="priority-flag-icon" id="priorityFlagIcon">⚑</span><select id="taskPriority"><option value="none">⚪ Без приоритета</option><option value="low">🔵 Низкий</option><option value="medium">🟡 Средний</option><option value="high">🔴 Высокий</option></select></div><button class="close-button" type="button" id="closeModal">×</button></div></div>
<div class="field"><label for="taskTitle">Заголовок</label><input id="taskTitle" maxlength="120" required placeholder="Что нужно сделать?"></div>
<div class="field"><label for="taskDescription">Описание</label><textarea id="taskDescription" rows="3" placeholder="Добавь подробности (необязательно)"></textarea><div class="subtask-inline-bar"><button class="subtask-add-icon" type="button" id="addSubtask"><span class="ico">✓</span>Добавить подзадачу</button><span id="subtaskProgressText" class="muted"></span></div><div id="subtaskList"></div></div>
<div class="field"><label for="taskCategory">Область</label><select id="taskCategory"><option value="">Без области</option></select><button class="category-create-inline" type="button" id="addCategoryInline">＋ Новая область</button></div>
<div class="field"><label for="taskDate">Дата</label><input id="taskDate" type="date" required></div><div class="field"><label for="taskTime">Время</label><input id="taskTime" type="time"></div>
<div class="modal-actions"><button class="secondary" type="button" id="cancelModal">Отмена</button><button class="primary">Сохранить</button></div>
</form></div>
<script>
const today=new Date();today.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromISO=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const fmt=(d,o)=>new Intl.DateTimeFormat("ru-RU",o).format(d);
const weekdays=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
const key="planner-data-v3";
const initial={tasks:[
{id:1,title:"Позаниматься нидерландским",description:"",date:iso(today),time:"12:30",done:false},
{id:2,title:"Купить продукты",description:"",date:iso(today),time:"17:00",done:false},
{id:3,title:"Отправить документы",description:"Проверить все файлы",date:iso(addDays(today,1)),time:"09:30",done:false},
{id:4,title:"Запланировать поездку",description:"",date:iso(new Date(today.getFullYear()+1,today.getMonth(),today.getDate())),time:"",done:false}],
habits:[
{id:11,title:"Учить нидерландский",icon:"🇳🇱",days:[0,1,2,3,4,5,6],done:[]},
{id:12,title:"Читать 20 минут",icon:"📖",days:[0,1,2,3,4,5,6],done:[]},
{id:13,title:"Тренировка",icon:"🏋️",days:[0,2,4],done:[]}]};
let data;try{data=JSON.parse(localStorage.getItem(key))||initial}catch(e){data=initial}
data.categories=Array.isArray(data.categories)?data.categories:[];
data.habits=Array.isArray(data.habits)?data.habits:[];
data.tasks=(Array.isArray(data.tasks)?data.tasks:[]).map(t=>({...t,priority:["none","low","medium","high"].includes(t.priority)?t.priority:"none",category:t.category||"",subtasks:Array.isArray(t.subtasks)?t.subtasks.map((st,i)=>({id:st.id??(t.id+"-sub-"+i),title:st.title||"",done:!!st.done})):[]}));
let selectedDate=new Date(today),calendarDate=new Date(today),calendarMode="month",editingId=null,taskView="kanban",editingSubtasks=[];
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

// Генерируем короткий звук через браузер, без отдельного аудиофайла.
function clickSound(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=720;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.06,c.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.055);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06);o.onended=()=>c.close()}catch(e){}}

function priorityBadge(priority){const labels={low:"Низкий",medium:"Средний",high:"Высокий"};return priority&&priority!=="none"?'<span class="badge priority-'+priority+'">'+labels[priority]+'</span>':""}
function categoryBadge(category){return category?'<span class="badge">'+esc(category)+'</span>':""}
function categoryColor(category){const colors=["#73acf5","#89cbb2","#edb77b","#b19ae8","#e99baa"];let n=0;for(const ch of category)n=(n*31+ch.charCodeAt(0))>>>0;return colors[n%colors.length]}
function categoryTag(category){return category?'<span class="category-tag"><i class="category-dot" style="background:'+categoryColor(category)+'"></i>'+esc(category)+'</span>':""}
function firstLine(text){return String(text||"").split("\n")[0]}
function dayLabel(dateValue,done=false){
 const d=fromISO(dateValue),delta=Math.round((d-today)/86400000);
 if(done)return "Выполнено";
 if(delta===0)return "Сегодня";if(delta===1)return "Завтра";if(delta===-1)return "Вчера";
 if(delta<=-2){const n=Math.abs(delta),lastTwo=n%100,last=n%10,word=(lastTwo>=11&&lastTwo<=14)?"дней":(last===1)?"день":(last>=2&&last<=4)?"дня":"дней";return n+" "+word}
 return fmt(d,{weekday:"short",day:"numeric",month:"short"});
}
function dueLabel(task){const delta=Math.round((fromISO(task.date)-today)/86400000),label=dayLabel(task.date,task.done);return '<span class="due-label '+(delta<0&&!task.done?"overdue":(task.done?"done-past":""))+'">'+label+'</span>'}
function isOverdueLabel(label){if(label==="Вчера")return true;const n=Number.parseInt(label,10);return Number.isFinite(n)&&n>=2}
function priorityClass(priority){return ["low","medium","high"].includes(priority)?"priority-edge-"+priority:"priority-edge-none"}
function subtaskStats(items){const valid=(items||[]).filter(x=>x.title&&x.title.trim()),done=valid.filter(x=>x.done).length;return {total:valid.length,done,percent:valid.length?Math.round(done/valid.length*100):0}}
function subtaskProgress(items){const p=subtaskStats(items);return p.total?'<div class="subtask-progress"><span>'+p.done+'/'+p.total+' · '+p.percent+'%</span><i><b style="width:'+p.percent+'%"></b></i></div>':""}
function taskMarkup(t,compact=false){return '<article class="kanban-card '+(compact?"list-card":"")+' '+priorityClass(t.priority)+'" data-edit="'+t.id+'"><input class="task-check" type="checkbox" data-check="'+t.id+'" '+(t.done?"checked":"")+'><div class="task-copy"><span class="task-title '+(t.done?"done":"")+'">'+esc(t.title)+'</span>'+(t.description?'<span class="task-description">'+esc(firstLine(t.description))+'</span>':"")+subtaskProgress(t.subtasks)+'<div class="kanban-meta">'+dueLabel(t)+categoryTag(t.category)+(t.time?'<span class="task-time">'+esc(t.time)+'</span>':"")+'</div></div></article>'}

function renderCategoryOptions(selected){
 const select=document.getElementById("taskCategory"),current=selected!==undefined?selected:select.value;
 select.innerHTML='<option value="">Без области</option>'+data.categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");
 if(data.categories.includes(current))select.value=current;else select.value="";
}

function renderTasks(id,dateKey){
 const box=document.getElementById(id),isToday=id==="taskList";
 let list=data.tasks.filter(t=>isToday||t.date===dateKey).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"99:99").localeCompare(b.time||"99:99"));
 if(isToday){
  const planned=list.filter(t=>!t.done),completed=list.filter(t=>t.done);
  const section=(title,items,done)=>'<section class="task-group '+(done?"completed-group":"planned-group")+'"><h3 class="task-group-title">'+title+'<span>'+items.length+'</span></h3>'+ (items.length?items.map(t=>taskMarkup(t)).join(""):'<div class="empty">'+(done?"Выполненных задач пока нет.":"Нет запланированных задач.")+'</div>')+'</section>';
  if(taskView==="kanban"){
   box.className="today-groups kanban-view";
   box.innerHTML=section("Запланированные",planned,false)+section("Выполненные",completed,true);
  }else{
   box.className="ticktick-list";
   const groups=new Map();planned.forEach(t=>{const label=dayLabel(t.date,false);if(!groups.has(label))groups.set(label,[]);groups.get(label).push(t)});
   const sorted=[...groups.entries()].sort((a,b)=>{
    const ad=Math.min(...planned.filter(t=>dayLabel(t.date,false)===a[0]).map(t=>fromISO(t.date).getTime()));
    const bd=Math.min(...planned.filter(t=>dayLabel(t.date,false)===b[0]).map(t=>fromISO(t.date).getTime()));return ad-bd;
   });
   const dateGroups=sorted.map(([label,items],i)=>'<details class="date-group" '+(i===0?"open":"")+'><summary class="date-group-title '+(isOverdueLabel(label)?"overdue":"")+'"><span>'+esc(label)+'</span><span class="date-group-count">'+items.length+' <i>⌄</i></span></summary><div class="date-group-card">'+items.map(t=>taskMarkup(t,true)).join("")+'</div></details>').join("");
   box.innerHTML=(dateGroups||'<div class="empty">Нет запланированных задач.</div>')+'<details class="date-group completed-list-group"><summary class="date-group-title completed-heading"><span>Выполненные</span><span class="date-group-count">'+completed.length+' <i>⌄</i></span></summary><div class="date-group-card">'+(completed.length?completed.map(t=>taskMarkup(t,true)).join(""):'<div class="empty">Выполненных задач пока нет.</div>')+'</div></details>';
  }
  box.querySelectorAll("[data-check]").forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{const t=data.tasks.find(x=>x.id===Number(cb.dataset.check));if(t){t.done=cb.checked;clickSound();save();render()}}});
  box.querySelectorAll("[data-edit]").forEach(card=>card.onclick=e=>{if(e.target.closest("input"))return;openModal(Number(card.dataset.edit))});
  return;
 }
 box.className="task-list";
 box.innerHTML=list.length?list.map(t=>'<div class="task-row '+(t.done?"done":"")+'" data-edit="'+t.id+'"><input class="task-check" type="checkbox" data-check="'+t.id+'" '+(t.done?"checked":"")+'><div class="task-copy"><span class="task-title">'+esc(t.title)+'</span>'+(t.description?'<span class="task-description">'+esc(firstLine(t.description))+'</span>':"")+'<div class="task-badges">'+priorityBadge(t.priority)+categoryBadge(t.category)+'</div></div><span class="task-time">'+esc(t.time||"")+'</span></div>').join(""):'<div class="empty">На этот день задач пока нет.</div>';
 box.querySelectorAll("[data-check]").forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{const t=data.tasks.find(x=>x.id===Number(cb.dataset.check));if(t){t.done=cb.checked;clickSound();save();render()}}});box.querySelectorAll("[data-edit]").forEach(row=>row.onclick=e=>{if(e.target.closest("[data-check]"))return;openModal(Number(row.dataset.edit))});
}

function renderHabits(){
 const day=(selectedDate.getDay()+6)%7,dateKey=iso(selectedDate),list=data.habits.filter(h=>h.days.includes(day));
 document.getElementById("habitList").innerHTML=list.length?list.map(h=>{const yes=h.done.includes(dateKey);return '<div class="habit-row"><span>'+h.icon+'</span><span class="habit-name">'+esc(h.title)+'</span><button class="habit-check '+(yes?"done":"")+'" data-habit="'+h.id+'">'+(yes?"✓":"○")+'</button></div>'}).join(""):'<div class="empty">На этот день привычек нет.</div>';
 document.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>{const h=data.habits.find(x=>x.id===Number(b.dataset.habit));if(!h)return;h.done=h.done.includes(dateKey)?h.done.filter(x=>x!==dateKey):h.done.concat(dateKey);save();render()});
}
function renderCalendar(){
 const box=document.getElementById("calendarContent"),title=document.getElementById("periodTitle"),y=calendarDate.getFullYear(),m=calendarDate.getMonth();
 title.textContent=calendarMode==="year"?String(y):fmt(calendarDate,{month:"long",year:"numeric"});
 document.querySelectorAll("#calendarTabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===calendarMode));
 if(calendarMode==="day"){box.innerHTML='<div class="empty">'+fmt(calendarDate,{weekday:"long",day:"numeric",month:"long"})+'</div>';return}
 if(calendarMode==="year"){
  box.innerHTML='<div class="year-grid">'+Array.from({length:12},(_,i)=>'<button class="year-month" data-month="'+i+'"><strong>'+fmt(new Date(y,i,1),{month:"long"})+'</strong><span>Открыть месяц →</span></button>').join("")+'</div>';
  box.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{calendarDate.setMonth(Number(b.dataset.month));calendarMode="month";renderCalendar()});return
 }
 if(calendarMode==="week"){
  const start=mondayOf(calendarDate);box.innerHTML='<div class="week-agenda">'+Array.from({length:7},(_,i)=>{const d=addDays(start,i),ls=data.tasks.filter(t=>t.date===iso(d));return '<div class="week-column '+(iso(d)===iso(today)?"today":"")+'"><h3>'+weekdays[i]+" "+d.getDate()+'</h3>'+ls.map(t=>'<div class="week-event">'+esc(t.title)+'</div>').join("")+'</div>'}).join("")+'</div>';return
 }
 const first=new Date(y,m,1),start=mondayOf(first),count=new Date(y,m+1,0).getDate(),cells=Math.ceil(((first.getDay()+6)%7+count)/7)*7;
 box.innerHTML='<div class="calendar-grid">'+weekdays.map(d=>'<div class="calendar-weekday">'+d+'</div>').join("")+Array.from({length:cells},(_,i)=>{const d=addDays(start,i),s=iso(d),ls=data.tasks.filter(t=>t.date===s);let c="calendar-cell";if(d.getMonth()!==m)c+=" other";if(s===iso(today))c+=" today";if(s===iso(selectedDate))c+=" selected";return '<button class="'+c+'" data-date="'+s+'">'+d.getDate()+(ls.length?'<small>'+ls.length+' задач</small>':"")+'</button>'}).join("")+'</div>';
 box.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selectedDate=fromISO(b.dataset.date);calendarDate=new Date(selectedDate);render()});
}
function render(){
 const title="Задачи · "+fmt(selectedDate,{day:"numeric",month:"long"});
 document.getElementById("greeting").textContent=fmt(today,{weekday:"long",day:"numeric",month:"long"});document.getElementById("todayNavDate").textContent=String(today.getDate());
 document.getElementById("selectedDateTitle").textContent="Мои задачи";
 document.getElementById("calendarDayTitle").textContent=title;
 renderTasks("taskList",iso(today));renderTasks("calendarTaskList",iso(selectedDate));renderHabits();renderCalendar();
}

function openModal(id,defaultDate){
 editingId=id===undefined?null:id;const t=editingId===null?null:data.tasks.find(x=>x.id===editingId);editingSubtasks=t?(t.subtasks||[]).map(x=>({...x})):[];
 document.getElementById("modalTitle").textContent=t?"Редактировать задачу":"Новая задача";
 document.getElementById("taskTitle").value=t?t.title:"";
 document.getElementById("taskDescription").value=t?t.description||"":"";
 document.getElementById("taskDate").value=t?t.date:(defaultDate||iso(selectedDate));
 document.getElementById("taskTime").value=t?t.time||"":"";
 renderCategoryOptions(t?t.category||"":"");renderSubtasks();document.getElementById("taskPriority").value=t?t.priority||"none":"none";document.getElementById("taskCategory").value=t?t.category||"":"";updatePriorityFlagIcon();
 document.getElementById("taskModal").classList.add("open");
}
function renderSubtasks(){
 const box=document.getElementById("subtaskList");if(!box)return;
 box.innerHTML=editingSubtasks.map(st=>'<div class="subtask-editor" data-subtask="'+esc(st.id)+'"><input type="checkbox" data-subtask-check="'+esc(st.id)+'" '+(st.done?"checked":"")+'><input type="text" maxlength="120" placeholder="Название подзадачи" value="'+esc(st.title)+'" data-subtask-title="'+esc(st.id)+'"><button type="button" aria-label="Удалить подзадачу" data-subtask-remove="'+esc(st.id)+'">×</button></div>').join("");
 box.querySelectorAll("[data-subtask-check]").forEach(cb=>cb.onchange=()=>{const st=editingSubtasks.find(x=>String(x.id)===cb.dataset.subtaskCheck);if(st){st.done=cb.checked;updateSubtaskProgress()}});
 box.querySelectorAll("[data-subtask-title]").forEach(input=>input.oninput=()=>{const st=editingSubtasks.find(x=>String(x.id)===input.dataset.subtaskTitle);if(st){st.title=input.value;updateSubtaskProgress()}});
 box.querySelectorAll("[data-subtask-remove]").forEach(button=>button.onclick=()=>{editingSubtasks=editingSubtasks.filter(x=>String(x.id)!==button.dataset.subtaskRemove);renderSubtasks()});updateSubtaskProgress();
}
function updateSubtaskProgress(){const p=subtaskStats(editingSubtasks),text=document.getElementById("subtaskProgressText");text.textContent=p.total?p.done+"/"+p.total+" · "+p.percent+"%":""}
function updatePriorityFlagIcon(){
 const colors={none:"var(--flag-none)",low:"var(--flag-low)",medium:"var(--flag-medium)",high:"var(--flag-high)"};
 const v=document.getElementById("taskPriority").value;
 document.getElementById("priorityFlagIcon").style.color=colors[v]||colors.none;
}
document.getElementById("taskPriority").addEventListener("change",updatePriorityFlagIcon);
function createCategoryInTask(){
 const input=document.getElementById("taskCategory"),previous=input.value;
 const answer=prompt("Название новой области:");
 if(!answer||!answer.trim()){renderCategoryOptions(previous);return}
 const name=answer.trim(),existing=data.categories.find(c=>c.toLocaleLowerCase()===name.toLocaleLowerCase());
 const value=existing||name;if(!existing)data.categories.push(name);save();renderCategoryOptions(value);
}
function closeModal(){document.getElementById("taskModal").classList.remove("open")}
document.getElementById("addTask").onclick=()=>openModal(undefined,iso(today));
document.getElementById("addCategoryInline").onclick=()=>createCategoryInTask();
document.getElementById("addSubtask").onclick=()=>{editingSubtasks.push({id:Date.now()+Math.random(),title:"",done:false});renderSubtasks()};
document.getElementById("addCalendarTask").onclick=()=>openModal(undefined,iso(selectedDate));
document.getElementById("closeModal").onclick=closeModal;
document.getElementById("cancelModal").onclick=closeModal;
document.getElementById("taskModal").onclick=e=>{if(e.target.id==="taskModal")closeModal()};
document.getElementById("taskForm").onsubmit=e=>{
 e.preventDefault();const previous=editingId===null?null:data.tasks.find(t=>t.id===editingId);const task={id:editingId===null?Date.now():editingId,subtasks:editingSubtasks.filter(x=>x.title.trim()).map(x=>({...x,title:x.title.trim()})),title:document.getElementById("taskTitle").value.trim(),description:document.getElementById("taskDescription").value.trim(),date:document.getElementById("taskDate").value,time:document.getElementById("taskTime").value,priority:document.getElementById("taskPriority").value,category:document.getElementById("taskCategory").value,done:previous?previous.done:false};
 if(editingId===null)data.tasks.push(task);else data.tasks=data.tasks.map(t=>t.id===editingId?task:t);
 selectedDate=fromISO(task.date);calendarDate=new Date(selectedDate);save();closeModal();render();
};
document.getElementById("addHabit").onclick=()=>{const name=prompt("Какую привычку добавить?");if(!name||!name.trim())return;data.habits.push({id:Date.now(),title:name.trim(),icon:"✨",days:[0,1,2,3,4,5,6],done:[]});save();render()};
document.getElementById("calendarTabs").onclick=e=>{const b=e.target.closest("[data-mode]");if(b){calendarMode=b.dataset.mode;renderCalendar()}};
document.getElementById("periodPrev").onclick=()=>{if(calendarMode==="year")calendarDate.setFullYear(calendarDate.getFullYear()-1);else if(calendarMode==="week")calendarDate=addDays(calendarDate,-7);else if(calendarMode==="day")calendarDate=addDays(calendarDate,-1);else calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};
document.getElementById("periodNext").onclick=()=>{if(calendarMode==="year")calendarDate.setFullYear(calendarDate.getFullYear()+1);else if(calendarMode==="week")calendarDate=addDays(calendarDate,7);else if(calendarMode==="day")calendarDate=addDays(calendarDate,1);else calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};
document.querySelectorAll(".nav-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.view).classList.add("active")});
render();
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
</script></body></html>
