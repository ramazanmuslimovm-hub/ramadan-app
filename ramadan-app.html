function tr(text){return settings.language==="en"?(EN[text]||text):text}
function applyTranslations(){
 document.documentElement.lang=settings.language;
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=tr(el.dataset.i18n));

const systemTheme=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):{matches:false};
function currentBackgroundPage(){const view=document.querySelector('.view.active')?.id||'todayView';return view==='todayView'?(taskPage!=='today'?taskPage:homeSection==='habits'?'homeHabits':homeSection):view}
function backgroundFor(page){const bg=settings.backgrounds[page];if(bg?.type==='color'&&/^#[0-9a-f]{6}$/i.test(bg.value))return bg;if(bg?.type==='image'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(bg.value))return bg;return null}
function paintBackground(el,bg){el.style.backgroundColor=bg?.type==='color'?bg.value:'';el.style.backgroundImage=bg?.type==='image'?'url("'+bg.value+'")':''}
function applyAppearance(){
 const dark=settings.theme==='dark'||settings.theme==='system'&&systemTheme.matches;
 document.documentElement.dataset.theme=dark?'dark':'light';
 document.querySelector('meta[name="theme-color"]').content=dark?'#141720':'#f7f8fc';
 const bg=backgroundFor(currentBackgroundPage());document.body.classList.toggle('custom-background',!!bg);paintBackground(document.querySelector('.page-wallpaper'),bg);
}
function storeSettings(previous){
 try{localStorage.setItem(settingsKey,JSON.stringify(settings));return true}catch(e){settings=previous;setSettingsStatus('Не удалось сохранить настройки. Возможно, память браузера заполнена.');return false}
}
function setSettingsStatus(message){const el=document.getElementById('settingsStatus');el.dataset.message=message;el.textContent=tr(message)}
function changeSetting(name,value){const previous=JSON.parse(JSON.stringify(settings));settings[name]=value;storeSettings(previous);applyAppearance();applyTranslations();render();renderSettings();updateScheduleLabels()}
const backgroundPalette=[['#f7f8fc','Белый'],['#dce8ff','Голубой'],['#e9e1fa','Лавандовый'],['#dceee5','Зелёный'],['#f4e8d4','Песочный'],['#f5dfe8','Розовый'],['#303848','Графитовый'],['#11151d','Чёрный']];
function renderSettings(){
 document.getElementById('themeMode').value=settings.theme;document.getElementById('appLanguage').value=settings.language;
 const bg=backgroundFor(document.getElementById('backgroundPage').value);paintBackground(document.getElementById('backgroundPreview'),bg);
 document.getElementById('backgroundColors').innerHTML=backgroundPalette.map(([color,name])=>'<button class="color-swatch'+(bg?.type==='color'&&bg.value===color?' selected':'')+'" type="button" data-background-color="'+color+'" style="background:'+color+'" aria-label="'+tr(name)+'" title="'+tr(name)+'" aria-pressed="'+(bg?.type==='color'&&bg.value===color)+'"></button>').join('');
 document.querySelectorAll('[data-background-color]').forEach(b=>b.onclick=()=>{photoRequest++;setBackground(document.getElementById('backgroundPage').value,{type:'color',value:b.dataset.backgroundColor})});
 const status=document.getElementById('settingsStatus');if(status.dataset.message)status.textContent=tr(status.dataset.message);
}
function setBackground(page,bg){const previous=JSON.parse(JSON.stringify(settings));if(bg)settings.backgrounds[page]=bg;else delete settings.backgrounds[page];if(storeSettings(previous))setSettingsStatus(bg?'Фон сохранён.':'Фон сброшен.');applyAppearance();renderSettings()}
let photoRequest=0;
async function importBackground(file,page){
 if(!file)return;
 const request=++photoRequest;
 if(!file.type.startsWith('image/')){setSettingsStatus('Выберите изображение.');return}
 if(file.size>20*1024*1024){setSettingsStatus('Выберите изображение размером до 20 МБ.');return}
 setSettingsStatus('Загрузка изображения…');
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
  const ratio=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#f7f8fc';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
  let quality=.8,result=canvas.toDataURL('image/jpeg',quality);
  while(result.length>500000&&quality>.25){quality-=.1;result=canvas.toDataURL('image/jpeg',quality)}
  if(request!==photoRequest)return;
  if(result.length>600000){setSettingsStatus('Изображение слишком большое. Выберите другое.');return}
  setBackground(page,{type:'image',value:result});
 }catch(e){if(request===photoRequest)setSettingsStatus('Не удалось открыть изображение. Попробуйте JPEG, PNG или WebP.')}
 finally{URL.revokeObjectURL(url)}
}
function initAppearanceControls(){
 const modal=document.getElementById('settingsModal');
 document.getElementById('openSettings').onclick=()=>{document.getElementById('backgroundPage').value=currentBackgroundPage();setSettingsStatus('');renderSettings();applyTranslations();modal.classList.add('open')};
 document.getElementById('closeSettings').onclick=()=>modal.classList.remove('open');
 modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
 document.getElementById('themeMode').onchange=e=>changeSetting('theme',e.target.value);
 document.getElementById('appLanguage').onchange=e=>changeSetting('language',e.target.value);
 document.getElementById('backgroundPage').onchange=()=>{setSettingsStatus('');renderSettings()};
 document.getElementById('chooseBackground').onclick=()=>document.getElementById('backgroundFile').click();
 document.getElementById('backgroundFile').onchange=e=>{const file=e.target.files[0],page=document.getElementById('backgroundPage').value;e.target.value='';importBackground(file,page)};
 document.getElementById('resetBackground').onclick=()=>{photoRequest++;setBackground(document.getElementById('backgroundPage').value,null)};
 const onSystemTheme=()=>{if(settings.theme==='system')applyAppearance()};
 if(systemTheme.addEventListener)systemTheme.addEventListener('change',onSystemTheme);else if(systemTheme.addListener)systemTheme.addListener(onSystemTheme);
 // Lock page scrolling without changing modal width when its content grows.
 const syncLock=()=>document.body.classList.toggle('modal-open',!!document.querySelector('.backdrop.open'));
 const observer=new MutationObserver(syncLock);document.querySelectorAll('.backdrop').forEach(el=>observer.observe(el,{attributes:true,attributeFilter:['class']}));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){const open=[...document.querySelectorAll('.backdrop.open')].pop();if(open?.id==='menuModal')closeMenu();else if(open)open.classList.remove('open')}});
 document.querySelectorAll('.close-button').forEach(b=>{b.dataset.i18nAriaLabel='Закрыть';b.setAttribute('aria-label',tr('Закрыть'))});
 document.getElementById('periodPrev').dataset.i18nAriaLabel='Предыдущий период';document.getElementById('periodNext').dataset.i18nAriaLabel='Следующий период';
}

const today=new Date();today.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromISO=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const fmt=(d,o)=>new Intl.DateTimeFormat(settings.language==="en"?"en-GB":"ru-RU",o).format(d);
const weekdaysRU=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
const weekdayLabels=()=>settings.language==="en"?["MON","TUE","WED","THU","FRI","SAT","SUN"]:weekdaysRU;
const key="planner-data-v3";
const initial={tasks:[
{id:1,title:"Позаниматься нидерландским",description:"",date:iso(today),time:"12:30",done:false},
{id:2,title:"Купить продукты",description:"",date:iso(today),time:"17:00",done:false},
{id:3,title:"Отправить документы",description:"Проверить все файлы",date:iso(addDays(today,1)),time:"09:30",done:false},
{id:4,title:"Запланировать поездку",description:"",date:iso(new Date(today.getFullYear()+1,today.getMonth(),today.getDate())),time:"",done:false}],
habits:[
{id:11,title:"Учить нидерландский",icon:"🇳🇱",days:[0,1,2,3,4,5,6],done:[]},
{id:12,title:"Читать 20 минут",icon:"📖",days:[0,1,2,3,4,5,6],done:[]},
{id:13,title:"Тренировка",icon:"🏋️",days:[0,2,4],done:[]}]};
let data;try{data=JSON.parse(localStorage.getItem(key))||initial}catch(e){data=initial}
data.categories=Array.isArray(data.categories)?data.categories:[];
data.habits=Array.isArray(data.habits)?data.habits:[];
data.tasks=(Array.isArray(data.tasks)?data.tasks:[]).map(t=>({...t,priority:["none","low","medium","high"].includes(t.priority)?t.priority:"none",category:t.category||"",subtasks:Array.isArray(t.subtasks)?t.subtasks.map((st,i)=>({id:st.id??(t.id+"-sub-"+i),title:st.title||"",done:!!st.done})):[]}));
if(data.categories.length&&typeof data.categories[0]==="string"){
 const map={};
 data.categories=data.categories.map(name=>{const id="cat-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);map[name]=id;return {id,name,color:categoryColor(name)}});
 data.tasks=data.tasks.map(t=>({...t,category:t.category?(map[t.category]||""):""}));
}
const CATEGORY_COLORS=["#73acf5","#89cbb2","#edb77b","#b19ae8","#e99baa","#f2637a","#5cc0c0","#f0b429","#8f9bff","#6bc47d"];

const taskPageLabels={"today": "Сегодня", "tomorrow": "Завтра", "week": "Вся неделя", "inbox": "Входящие", "all": "Все задачи"};
let selectedDate=new Date(today),calendarDate=new Date(today),calendarMode="month",editingId=null,taskView="kanban",editingSubtasks=[];
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

// Генерируем короткий звук через браузер, без отдельного аудиофайла.
function clickSound(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=720;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.06,c.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.055);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06);o.onended=()=>c.close()}catch(e){}}

function priorityBadge(priority){const labels={low:tr("Низкий"),medium:tr("Средний"),high:tr("Высокий")};return priority&&priority!=="none"?'<span class="badge priority-'+priority+'">'+labels[priority]+'</span>':""}
function getCategory(id){return data.categories.find(c=>c.id===id)}
function categoryBadge(id){const c=getCategory(id);return c?'<span class="badge">'+esc(c.name)+'</span>':""}
function categoryColor(category){const colors=["#73acf5","#89cbb2","#edb77b","#b19ae8","#e99baa"];let n=0;for(const ch of category)n=(n*31+ch.charCodeAt(0))>>>0;return colors[n%colors.length]}
function categoryTag(id){const c=getCategory(id);return c?'<span class="category-tag"><i class="category-dot" style="background:'+c.color+'"></i><span class="category-name">'+esc(c.name)+'</span></span>':""}
function firstLine(text){return String(text||"").split("\n")[0]}
function dayLabel(dateValue,done=false){
 if(!dateValue)return done?tr("Выполнено"):tr("Без даты");
 const d=fromISO(dateValue),delta=Math.round((d-today)/86400000);
 if(done)return tr("Выполнено");
 if(delta===0)return tr("Сегодня");if(delta===1)return tr("Завтра");if(delta===-1)return tr("Вчера");
 if(delta<=-2){const n=Math.abs(delta),lastTwo=n%100,last=n%10,word=(lastTwo>=11&&lastTwo<=14)?"дней":(last===1)?"день":(last>=2&&last<=4)?"дня":"дней";return settings.language==="en"?n+" days":n+" "+word}
 return fmt(d,{weekday:"short",day:"numeric",month:"short"});
}
function scheduledTime(task){
 if(!task.time||!task.date)return null;
 const d=fromISO(task.date),parts=task.time.split(":").map(Number);
 d.setHours(parts[0],parts[1]||0,0,0);
 return Number.isFinite(d.getTime())?d.getTime():null;
}
function isTaskOverdue(task){
 if(task.done||!task.date)return false;
 if(task.date<iso(today))return true;
 const start=scheduledTime(task);
 return start!==null&&start<Date.now();
}
function minuteWord(n){if(settings.language==="en")return n===1?"minute":"minutes";const v=n%100;return v>=11&&v<=14?"минут":n%10===1?"минуту":n%10>=2&&n%10<=4?"минуты":"минут"}
function startCountdown(task){
 if(task.done)return "";
 const start=scheduledTime(task);
 if(start===null||start<Date.now())return "";
 const minutes=Math.ceil((start-Date.now())/60000);
 return '<span class="task-start">'+(minutes?(settings.language==="en"?"Starts in: ":"До начала: ")+minutes+(settings.language==="en"?" min":" мин"):tr("Время начинать"))+'</span>';
}
function dueLabel(task){
 if(!task.date)return '<span class="due-label done-past">'+tr(task.done?"Выполнено":"Без даты")+'</span>';
 const delta=Math.round((fromISO(task.date)-today)/86400000);
 let label=dayLabel(task.date,task.done),overdue=isTaskOverdue(task);
 // Для прошлых дней сохраняем «Вчера», «2 дня» и т. д.
 if(overdue&&delta===0){
  const minutes=Math.floor((Date.now()-scheduledTime(task))/60000);
  label=minutes===0?tr("Просрочено менее минуты"):minutes<60?(settings.language==="en"?"Overdue by ":"Просрочено на ")+minutes+" "+minuteWord(minutes):(settings.language==="en"?"Overdue by ":"Просрочено на ")+Math.floor(minutes/60)+(settings.language==="en"?" h":" ч");
 }
 return '<span class="due-label '+(overdue?"overdue":task.done?"done-past":"")+'">'+label+'</span>';
}
function isOverdueLabel(label){if(label===tr("Вчера"))return true;const n=Number.parseInt(label,10);return Number.isFinite(n)&&n>=2}
function priorityClass(priority){return ["low","medium","high"].includes(priority)?"priority-edge-"+priority:"priority-edge-none"}
function subtaskStats(items){const valid=(items||[]).filter(x=>x.title&&x.title.trim()),done=valid.filter(x=>x.done).length;return {total:valid.length,done,percent:valid.length?Math.round(done/valid.length*100):0}}
function subtaskProgress(items){const p=subtaskStats(items);return p.total?'<div class="subtask-progress"><span>'+p.done+'/'+p.total+' · '+p.percent+'%</span><i><b style="width:'+p.percent+'%"></b></i></div>':""}
function taskMarkup(t,compact=false){return '<article class="kanban-card '+(compact?"list-card":"")+' '+priorityClass(t.priority)+'" data-edit="'+t.id+'"><input class="task-check" type="checkbox" data-check="'+t.id+'" '+(t.done?"checked":"")+'><div class="task-copy"><span class="task-title '+(t.done?"done":"")+'">'+esc(t.title)+'</span>'+(t.description?'<span class="task-description">'+esc(firstLine(t.description))+'</span>':"")+subtaskProgress(t.subtasks)+'<div class="kanban-meta">'+dueLabel(t)+categoryTag(t.category)+(t.time?'<span class="task-time">'+esc(t.time)+'</span>':"")+'</div>'+startCountdown(t)+'</div></article>'}

function renderTasks(id,dateKey){
 const box=document.getElementById(id),isToday=id==="taskList";
 let list=data.tasks.filter(t=>isToday?matchesTaskPage(t):t.date===dateKey).sort((a,b)=>(a.date||"9999-12-31").localeCompare(b.date||"9999-12-31")||(a.time||"99:99").localeCompare(b.time||"99:99"));
 if(isToday){
  const planned=list.filter(t=>!t.done),completed=list.filter(t=>t.done);
  const section=(title,items,done)=>'<section class="task-group '+(done?"completed-group":"planned-group")+'"><h3 class="task-group-title">'+title+'<span>'+items.length+'</span></h3>'+ (items.length?items.map(t=>taskMarkup(t)).join(""):'<div class="empty">'+(done?tr("Выполненных задач пока нет."):tr("Нет запланированных задач."))+'</div>')+'</section>';
  if(taskView==="kanban"){
   box.className="today-groups kanban-view";
   box.innerHTML=taskPage==="today"&&homeSection==="overdue"?(planned.length?planned.map(t=>taskMarkup(t)).join(""):'<div class="empty">'+tr("Просроченных задач нет.")+'</div>'):section(tr("Запланированные"),planned,false)+section(tr("Выполненные"),completed,true);
  }else{
   box.className="ticktick-list";
   const groups=new Map();planned.forEach(t=>{const label=dayLabel(t.date,false);if(!groups.has(label))groups.set(label,[]);groups.get(label).push(t)});
   const sorted=[...groups.entries()].sort((a,b)=>{
    const ad=Math.min(...planned.filter(t=>dayLabel(t.date,false)===a[0]).map(t=>fromISO(t.date).getTime()));
    const bd=Math.min(...planned.filter(t=>dayLabel(t.date,false)===b[0]).map(t=>fromISO(t.date).getTime()));return ad-bd;
   });
   const dateGroups=sorted.map(([label,items],i)=>'<details class="date-group" '+(i===0?"open":"")+'><summary class="date-group-title '+(isOverdueLabel(label)?"overdue":"")+'"><span>'+esc(label)+'</span><span class="date-group-count">'+items.length+' <i>⌄</i></span></summary><div class="date-group-card">'+items.map(t=>taskMarkup(t,true)).join("")+'</div></details>').join("");
   box.innerHTML=(dateGroups||'<div class="empty">'+tr("Нет запланированных задач.")+'</div>')+'<details class="date-group completed-list-group"><summary class="date-group-title completed-heading"><span>'+tr("Выполненные")+'</span><span class="date-group-count">'+completed.length+' <i>⌄</i></span></summary><div class="date-group-card">'+(completed.length?completed.map(t=>taskMarkup(t,true)).join(""):'<div class="empty">'+tr("Выполненных задач пока нет.")+'</div>')+'</div></details>';
  }
  box.querySelectorAll("[data-check]").forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{const t=data.tasks.find(x=>x.id===Number(cb.dataset.check));if(t){t.done=cb.checked;clickSound();save();render()}}});
  box.querySelectorAll("[data-edit]").forEach(card=>card.onclick=e=>{if(e.target.closest("input"))return;openModal(Number(card.dataset.edit))});
  return;
 }
 box.className="task-list";
 box.innerHTML=list.length?list.map(t=>'<div class="task-row '+(t.done?"done":"")+'" data-edit="'+t.id+'"><input class="task-check" type="checkbox" data-check="'+t.id+'" '+(t.done?"checked":"")+'><div class="task-copy"><span class="task-title">'+esc(t.title)+'</span>'+(t.description?'<span class="task-description">'+esc(firstLine(t.description))+'</span>':"")+'<div class="task-badges">'+priorityBadge(t.priority)+categoryBadge(t.category)+'</div></div><span class="task-time">'+esc(t.time||"")+'</span></div>').join(""):'<div class="empty">'+tr("На этот день задач пока нет.")+'</div>';
 box.querySelectorAll("[data-check]").forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{const t=data.tasks.find(x=>x.id===Number(cb.dataset.check));if(t){t.done=cb.checked;clickSound();save();render()}}});box.querySelectorAll("[data-edit]").forEach(row=>row.onclick=e=>{if(e.target.closest("[data-check]"))return;openModal(Number(row.dataset.edit))});
}

function renderHabits(id="habitList",date=selectedDate){
 const day=(date.getDay()+6)%7,dateKey=iso(date),list=data.habits.filter(h=>h.days.includes(day)),box=document.getElementById(id);
 box.innerHTML=list.length?list.map(h=>{const yes=h.done.includes(dateKey);return '<div class="habit-row"><span>'+esc(h.icon)+'</span><span class="habit-name">'+esc(h.title)+'</span><button class="habit-check '+(yes?"done":"")+'" aria-label="'+esc(h.title)+'" aria-pressed="'+yes+'" data-habit="'+h.id+'">'+(yes?"✓":"○")+'</button></div>'}).join(""):'<div class="empty">'+tr("На этот день привычек нет.")+'</div>';
 box.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>{const h=data.habits.find(x=>x.id===Number(b.dataset.habit));if(!h)return;const wasDone=h.done.includes(dateKey);h.done=wasDone?h.done.filter(x=>x!==dateKey):h.done.concat(dateKey);if(!wasDone)clickSound();save();render()});
}
function matchesTaskPage(task){
 if(taskPage==="all")return true;
 if(taskPage==="inbox")return !task.date;
 if(taskPage==="tomorrow")return task.date===iso(addDays(today,1));
 if(taskPage==="week"){const start=mondayOf(today);return !!task.date&&task.date>=iso(start)&&task.date<=iso(addDays(start,6))}
 return homeSection==="overdue"?isTaskOverdue(task):task.date===iso(today);
}
function renderHome(){
 const isToday=taskPage==="today";
 document.getElementById("homeTabs").hidden=!isToday;
 const pageTitle=document.getElementById("taskPageTitle");pageTitle.hidden=isToday;pageTitle.textContent=tr(taskPageLabels[taskPage]);
 const content=document.getElementById("homeContent");content.setAttribute("role",isToday?"tabpanel":"region");
 if(!isToday)content.setAttribute("aria-labelledby","taskPageTitle");
 document.querySelectorAll("[data-task-page]").forEach(b=>{if(b.dataset.taskPage===taskPage&&document.getElementById("todayView").classList.contains("active"))b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
 document.querySelectorAll("[data-home]").forEach(b=>{const active=b.dataset.home===homeSection;b.setAttribute("aria-selected",String(active));b.tabIndex=active?0:-1;if(active&&isToday)document.getElementById("homeContent").setAttribute("aria-labelledby",b.id)});
 const habits=isToday&&homeSection==="habits";
 document.getElementById("taskList").hidden=habits;
 document.getElementById("todayHabitList").hidden=!habits;
 document.getElementById("addTask").setAttribute("aria-label",habits?tr("Добавить привычку"):tr("Добавить задачу"));
 if(habits)renderHabits("todayHabitList",today);else renderTasks("taskList",iso(today));
}
function renderCalendar(){
 const box=document.getElementById("calendarContent"),title=document.getElementById("periodTitle"),y=calendarDate.getFullYear(),m=calendarDate.getMonth();
 title.textContent=calendarMode==="year"?String(y):fmt(calendarDate,{month:"long",year:"numeric"});
 document.querySelectorAll("#calendarTabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===calendarMode));
 if(calendarMode==="day"){box.innerHTML='<div class="empty">'+fmt(calendarDate,{weekday:"long",day:"numeric",month:"long"})+'</div>';return}
 if(calendarMode==="year"){
  box.innerHTML='<div class="year-grid">'+Array.from({length:12},(_,i)=>'<button class="year-month" data-month="'+i+'"><strong>'+fmt(new Date(y,i,1),{month:"long"})+'</strong><span>'+tr("Открыть месяц →")+'</span></button>').join("")+'</div>';
  box.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{calendarDate.setMonth(Number(b.dataset.month));calendarMode="month";renderCalendar()});return
 }
 if(calendarMode==="week"){
  const start=mondayOf(calendarDate);box.innerHTML='<div class="week-agenda">'+Array.from({length:7},(_,i)=>{const d=addDays(start,i),ls=data.tasks.filter(t=>t.date===iso(d));return '<div class="week-column '+(iso(d)===iso(today)?"today":"")+'"><h3>'+weekdayLabels()[i]+" "+d.getDate()+'</h3>'+ls.map(t=>'<div class="week-event">'+esc(t.title)+'</div>').join("")+'</div>'}).join("")+'</div>';return
 }
 const first=new Date(y,m,1),start=mondayOf(first),count=new Date(y,m+1,0).getDate(),cells=Math.ceil(((first.getDay()+6)%7+count)/7)*7;
 box.innerHTML='<div class="calendar-grid">'+weekdayLabels().map(d=>'<div class="calendar-weekday">'+d+'</div>').join("")+Array.from({length:cells},(_,i)=>{const d=addDays(start,i),s=iso(d),ls=data.tasks.filter(t=>t.date===s);let c="calendar-cell";if(d.getMonth()!==m)c+=" other";if(s===iso(today))c+=" today";if(s===iso(selectedDate))c+=" selected";return '<button class="'+c+'" data-date="'+s+'">'+d.getDate()+(ls.length?'<small>'+ls.length+(settings.language==="en"?(ls.length===1?' task':' tasks'):' задач')+'</small>':"")+'</button>'}).join("")+'</div>';
 box.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selectedDate=fromISO(b.dataset.date);calendarDate=new Date(selectedDate);render()});
}
function render(){
 const now=new Date();today.setTime(now.getTime());today.setHours(0,0,0,0);
 const title=(settings.language==="en"?"Tasks · ":"Задачи · ")+fmt(selectedDate,{day:"numeric",month:"long"});
 document.getElementById("greeting").textContent=taskPage==="week"?fmt(mondayOf(today),{day:"numeric",month:"short"})+" — "+fmt(addDays(mondayOf(today),6),{day:"numeric",month:"short"}):taskPage==="inbox"?tr("Задачи без даты"):fmt(taskPage==="tomorrow"?addDays(today,1):today,{weekday:"long",day:"numeric",month:"long"});document.getElementById("todayNavDate").textContent=String(today.getDate());
 document.getElementById("calendarDayTitle").textContent=title;
 renderHome();renderTasks("calendarTaskList",iso(selectedDate));renderHabits();renderCalendar();applyTranslations();applyAppearance();
}

function openModal(id,defaultDate){
 editingId=id===undefined?null:id;const t=editingId===null?null:data.tasks.find(x=>x.id===editingId);editingSubtasks=t?(t.subtasks||[]).map(x=>({...x})):[];
 document.getElementById("modalTitle").textContent=t?tr("Редактировать задачу"):tr("Новая задача");
 document.getElementById("taskTitle").value=t?t.title:"";
 document.getElementById("taskDescription").value=t?t.description||"":"";
 document.getElementById("taskDate").value=t?t.date:(defaultDate!==undefined?defaultDate:iso(selectedDate));
 document.getElementById("taskTime").value=t?t.time||"":"";
 renderCategoryOptions(t?t.category||"":"");renderSubtasks();document.getElementById("taskPriority").value=t?t.priority||"none":"none";document.getElementById("taskCategory").value=t?t.category||"":"";
 updatePriorityFlagIcon();updateScheduleLabels();
 document.getElementById("taskModal").classList.add("open");
}
function renderSubtasks(){
 const box=document.getElementById("subtaskList");if(!box)return;
 box.innerHTML=editingSubtasks.map(st=>'<div class="subtask-editor" data-subtask="'+esc(st.id)+'"><input type="checkbox" data-subtask-check="'+esc(st.id)+'" '+(st.done?"checked":"")+'><input type="text" maxlength="120" placeholder="'+esc(tr("Название подзадачи"))+'" value="'+esc(st.title)+'" data-subtask-title="'+esc(st.id)+'"><button type="button" aria-label="'+esc(tr("Удалить подзадачу"))+'" data-subtask-remove="'+esc(st.id)+'">×</button></div>').join("");
 box.querySelectorAll("[data-subtask-check]").forEach(cb=>cb.onchange=()=>{const st=editingSubtasks.find(x=>String(x.id)===cb.dataset.subtaskCheck);if(st){st.done=cb.checked;updateSubtaskProgress()}});
 box.querySelectorAll("[data-subtask-title]").forEach(input=>input.oninput=()=>{const st=editingSubtasks.find(x=>String(x.id)===input.dataset.subtaskTitle);if(st){st.title=input.value;updateSubtaskProgress()}});
 box.querySelectorAll("[data-subtask-remove]").forEach(button=>button.onclick=()=>{editingSubtasks=editingSubtasks.filter(x=>String(x.id)!==button.dataset.subtaskRemove);renderSubtasks()});updateSubtaskProgress();
}
function updateSubtaskProgress(){const p=subtaskStats(editingSubtasks),text=document.getElementById("subtaskProgressText");text.textContent=p.total?p.done+"/"+p.total+" · "+p.percent+"%":""}
function updatePriorityFlagIcon(){
 const colors={none:"var(--flag-none)",low:"var(--flag-low)",medium:"var(--flag-medium)",high:"var(--flag-high)"};
 const v=document.getElementById("taskPriority").value;
 document.getElementById("priorityFlagIcon").style.color=colors[v]||colors.none;
}
document.getElementById("taskPriority").addEventListener("change",updatePriorityFlagIcon);
function updateScheduleLabels(){
 const date=document.getElementById("taskDate").value,time=document.getElementById("taskTime").value;
 document.getElementById("taskDateLabel").textContent=date?fmt(fromISO(date),{day:"numeric",month:"short"}):tr("Без даты");
 document.getElementById("taskTimeLabel").textContent=time||tr("Время");
 document.getElementById("clearTaskTime").hidden=!time;
 document.getElementById("clearTaskDate").hidden=!date;
 document.getElementById("taskTime").disabled=!date;
}
for(const id of ["taskDate","taskTime"]){
 const input=document.getElementById(id);
 input.addEventListener("change",()=>{if(id==="taskDate"&&!input.value)document.getElementById("taskTime").value="";updateScheduleLabels()});
 input.addEventListener("click",()=>{try{if(input.showPicker)input.showPicker()}catch(e){}});
}
document.getElementById("clearTaskDate").onclick=()=>{document.getElementById("taskDate").value="";document.getElementById("taskTime").value="";updateScheduleLabels()};
document.getElementById("clearTaskTime").onclick=()=>{document.getElementById("taskTime").value="";updateScheduleLabels()};
function renderColorSwatches(){
 const box=document.getElementById("categoryColorSwatches");
 box.innerHTML=CATEGORY_COLORS.map(c=>'<button type="button" class="color-swatch'+(c===selectedCategoryColor?" selected":"")+'" style="background:'+c+'" data-color="'+c+'" aria-label="'+tr('Цвет')+' '+c+'"></button>').join("");
 box.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{selectedCategoryColor=b.dataset.color;renderColorSwatches()});
}
function openCategoryModal(cat){
 editingCategoryId=cat?cat.id:null;
 document.getElementById("categoryModalTitle").textContent=cat?tr("Изменить область"):tr("Новая область");
 document.getElementById("categoryNameInput").value=cat?cat.name:"";
 selectedCategoryColor=cat?cat.color:CATEGORY_COLORS[data.categories.length%CATEGORY_COLORS.length];
 renderColorSwatches();
 document.getElementById("deleteCategoryBtn").style.display=cat?"inline-block":"none";
 document.getElementById("categoryModal").classList.add("open");
}
document.getElementById("editCategoryInline").onclick=()=>{
 const cat=getCategory(document.getElementById("taskCategory").value);
 if(!cat){alert(tr("Сначала выберите область в списке."));return}
 openCategoryModal(cat);
};
document.getElementById("closeCategoryModal").onclick=()=>document.getElementById("categoryModal").classList.remove("open");
document.getElementById("cancelCategoryModal").onclick=()=>document.getElementById("categoryModal").classList.remove("open");
document.getElementById("categoryModal").onclick=e=>{if(e.target.id==="categoryModal")document.getElementById("categoryModal").classList.remove("open")};
document.getElementById("saveCategoryBtn").onclick=()=>{
 const name=document.getElementById("categoryNameInput").value.trim();if(!name)return;
 let keep=editingCategoryId;
 if(editingCategoryId){const cat=getCategory(editingCategoryId);if(cat){cat.name=name;cat.color=selectedCategoryColor}}
 else{keep="cat-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);data.categories.push({id:keep,name,color:selectedCategoryColor})}
 save();renderCategoryOptions(keep);document.getElementById("categoryModal").classList.remove("open");render();
};
document.getElementById("deleteCategoryBtn").onclick=()=>{
 if(!editingCategoryId)return;
 if(!confirm(tr("Удалить эту область? Задачи останутся без области.")))return;
 data.categories=data.categories.filter(c=>c.id!==editingCategoryId);
 data.tasks=data.tasks.map(t=>t.category===editingCategoryId?{...t,category:""}:t);
 save();renderCategoryOptions("");document.getElementById("categoryModal").classList.remove("open");render();
};

function closeModal(){document.getElementById("taskModal").classList.remove("open")}
document.getElementById("addTask").onclick=()=>taskPage==="today"&&homeSection==="habits"?addHabit():openModal(undefined,taskPage==="inbox"?"":iso(taskPage==="tomorrow"?addDays(today,1):today));
document.getElementById("addCategoryInline").onclick=()=>openCategoryModal(null);
document.getElementById("addSubtask").onclick=()=>{editingSubtasks.push({id:Date.now()+Math.random(),title:"",done:false});renderSubtasks()};
document.getElementById("addCalendarTask").onclick=()=>openModal(undefined,iso(selectedDate));
document.getElementById("closeModal").onclick=closeModal;
document.getElementById("cancelModal").onclick=closeModal;
document.getElementById("taskModal").onclick=e=>{if(e.target.id==="taskModal")closeModal()};
document.getElementById("taskForm").onsubmit=e=>{
 e.preventDefault();const previous=editingId===null?null:data.tasks.find(t=>t.id===editingId);const task={id:editingId===null?Date.now():editingId,subtasks:editingSubtasks.filter(x=>x.title.trim()).map(x=>({...x,title:x.title.trim()})),title:document.getElementById("taskTitle").value.trim(),description:document.getElementById("taskDescription").value.trim(),date:document.getElementById("taskDate").value,time:document.getElementById("taskTime").value,priority:document.getElementById("taskPriority").value,category:document.getElementById("taskCategory").value,done:previous?previous.done:false};
 if(editingId===null)data.tasks.push(task);else data.tasks=data.tasks.map(t=>t.id===editingId?task:t);
 if(task.date){selectedDate=fromISO(task.date);calendarDate=new Date(selectedDate)}else task.time="";save();closeModal();render();
};
function addHabit(){const name=prompt(tr("Какую привычку добавить?"));if(!name||!name.trim())return;data.habits.push({id:Date.now(),title:name.trim(),icon:"✨",days:[0,1,2,3,4,5,6],done:[]});save();render()}
document.getElementById("addHabit").onclick=addHabit;
document.getElementById("calendarTabs").onclick=e=>{const b=e.target.closest("[data-mode]");if(b){calendarMode=b.dataset.mode;renderCalendar()}};
document.getElementById("periodPrev").onclick=()=>{if(calendarMode==="year")calendarDate.setFullYear(calendarDate.getFullYear()-1);else if(calendarMode==="week")calendarDate=addDays(calendarDate,-7);else if(calendarMode==="day")calendarDate=addDays(calendarDate,-1);else calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};
document.getElementById("periodNext").onclick=()=>{if(calendarMode==="year")calendarDate.setFullYear(calendarDate.getFullYear()+1);else if(calendarMode==="week")calendarDate=addDays(calendarDate,7);else if(calendarMode==="day")calendarDate=addDays(calendarDate,1);else calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};
document.querySelectorAll(".nav-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.view).classList.add("active");if(b.dataset.view==="todayView"){taskPage="today";homeSection="today"}render()});
document.querySelectorAll("[data-home]").forEach((button,index,buttons)=>{
 button.onclick=()=>{homeSection=button.dataset.home;render()};
 button.onkeydown=e=>{let next;if(e.key==="ArrowRight")next=(index+1)%buttons.length;else if(e.key==="ArrowLeft")next=(index+buttons.length-1)%buttons.length;else if(e.key==="Home")next=0;else if(e.key==="End")next=buttons.length-1;else return;e.preventDefault();buttons[next].focus();buttons[next].click()};
});
function closeMenu(){document.getElementById("menuModal").classList.remove("open");document.getElementById("openMenu").setAttribute("aria-expanded","false");document.getElementById("openMenu").focus({preventScroll:true})}
function initMenu(){
 const modal=document.getElementById("menuModal"),trigger=document.getElementById("openMenu");
 trigger.onclick=()=>{renderHome();modal.classList.add("open");trigger.setAttribute("aria-expanded","true");(modal.querySelector('[aria-current="page"]')||modal.querySelector("[data-task-page]")).focus({preventScroll:true})};
 document.getElementById("closeMenu").onclick=closeMenu;modal.onclick=e=>{if(e.target===modal)closeMenu()};
 modal.onkeydown=e=>{if(e.key!=="Tab")return;const buttons=[...modal.querySelectorAll("button")],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}};
 document.querySelectorAll("[data-task-page]").forEach(button=>button.onclick=()=>{
  taskPage=button.dataset.taskPage;homeSection="today";
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id==="todayView"));
  document.querySelectorAll(".nav-button").forEach(b=>b.classList.toggle("active",b.dataset.view==="todayView"));
  closeMenu();render();
 });
}
initAppearanceControls();initMenu();
render();

function scheduleMinuteRefresh(){setTimeout(()=>{render();scheduleMinuteRefresh()},60000-Date.now()%60000+25)}
scheduleMinuteRefresh();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
