<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc"><title>Планер</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#232638;--muted:#858b9e;--line:#e9ebf2;--blue:#5269e8;--soft:#eef0ff;--green:#338b5d;--green-soft:#e8f6ee;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.app{width:min(100%,900px);margin:auto;padding:20px 18px 112px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750}.brand-icon{width:40px;height:40px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font-size:21px}.avatar{width:39px;height:39px;border-radius:50%;background:#e9eafa;color:#4d5cc2;display:grid;place-items:center;font-weight:700}
h1{margin:0;font-size:28px;letter-spacing:-.5px}h2{margin:0;font-size:17px}.muted{font-size:13px;color:var(--muted)}.heading{margin:8px 0 19px}.heading p{margin:0 0 5px;color:var(--muted)}
.panel{padding:18px;margin-bottom:15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 26px #25305a08}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.period-tools,.week-tools{display:flex;align-items:center;gap:7px}.icon-button{width:36px;height:36px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#60677b}.week-range{min-width:130px;text-align:center;color:var(--muted);font-size:12px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week-day{padding:9px 3px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--muted);text-align:center}.week-day.selected{background:var(--blue);border-color:var(--blue);color:white}.week-day span{display:block}.week-day .dow{font-size:10px}.week-day .num{margin-top:5px;color:var(--text);font-weight:700}.week-day.selected .num{color:white}
.task-list{display:grid;gap:6px}.task-row{display:flex;align-items:center;gap:11px;padding:12px 9px;border-radius:12px;cursor:pointer}.task-row:hover{background:#f8f9fc}.task-check{width:21px;height:21px;accent-color:var(--blue);flex:none;cursor:pointer}.task-copy{min-width:0;flex:1}.task-title{display:block;font-weight:600;overflow-wrap:anywhere}.task-description{display:block;margin-top:3px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.task-time{color:var(--muted);font-size:12px;white-space:nowrap}.task-row.done .task-title{text-decoration:line-through;color:#9da2af}.add-button,.primary{border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:650}.add-button{width:100%;margin-top:9px;text-align:left}.empty{padding:22px 8px;color:var(--muted);text-align:center}
.today-tools{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 13px}.today-tools .tabs button{font-size:13px;padding:8px 11px}.category-filter{max-width:48%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}.task-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;background:#f0f1f5;color:#697084;font-size:11px}.priority-low{background:#f4f5f8;color:#83899a}.priority-medium{background:#fff3bb;color:#4865db;box-shadow:inset 0 0 0 1px #93a4ff}.priority-high{background:#fff0ef;color:#d9534f}.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;overflow-x:auto}.kanban-column{min-width:155px;padding:10px;border-radius:13px;background:#f4f5f9}.kanban-column h3{margin:0 0 9px;font-size:12px;color:#646b7e}.kanban-count{margin-left:4px;color:#9ba0ad}.kanban-card{padding:10px;margin-bottom:7px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.kanban-card:hover{border-color:#c9cff8}.kanban-card .task-title{font-size:13px}.kanban-card .task-description{font-size:11px}.kanban-meta{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-top:8px}.kanban-meta select{max-width:100%;padding:5px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#5f6678;font-size:11px}.kanban-time{color:var(--muted);font-size:11px}
.tabs{display:flex;gap:3px;padding:4px;border-radius:12px;background:#f1f2f7}.tabs button{border:0;border-radius:9px;padding:7px 9px;background:transparent;color:var(--muted);font-size:12px}.tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px #20264210}.view{display:none}.view.active{display:block}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-weekday{padding:6px 0;color:var(--muted);font-size:10px;text-align:center}.calendar-cell{min-height:58px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);text-align:left;vertical-align:top}.calendar-cell.other{color:#b9bdc8}.calendar-cell.today{color:var(--blue);font-weight:700}.calendar-cell.selected{border:2px solid var(--blue)}.calendar-cell small{display:block;margin-top:4px;color:var(--blue);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.year-month{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.year-month strong{text-transform:capitalize}.year-month span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.week-agenda{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week-column{min-height:105px;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff}.week-column.today{background:#f5f7ff;border-color:#cfd6ff}.week-column h3{margin:0 0 7px;font-size:11px;color:var(--muted)}.week-event{margin:4px 0;padding:5px;border-radius:6px;background:var(--soft);font-size:10px;overflow-wrap:anywhere}
.habit-row{display:flex;align-items:center;gap:10px;padding:10px 3px;border-bottom:1px solid #f1f2f6}.habit-row:last-child{border:0}.habit-name{flex:1}.habit-check{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#9da2af}.habit-check.done{background:var(--green-soft);border-color:#d4ecdd;color:var(--green)}
.bottom-nav{position:fixed;z-index:5;right:0;bottom:0;left:0;display:flex;justify-content:center;gap:clamp(35px,12vw,90px);padding:8px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(12px)}.nav-button{min-width:76px;padding:4px 8px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:3px;font-size:13px}.nav-button .nav-icon{font-size:26px;line-height:1.1}.nav-button.active{color:var(--blue);font-weight:700}
.backdrop{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#20243a66}.backdrop.open{display:flex}.modal{width:min(100%,440px);padding:20px;border-radius:19px;background:#fff;box-shadow:0 20px 70px #12162b33}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{font-size:18px}.close-button{width:34px;height:34px;border:0;border-radius:10px;background:#f1f2f6;color:#656b7b}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#666c7e;font-weight:600}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;outline:none;background:white;color:var(--text)}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9ca8f5}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.secondary{padding:10px 13px;border:0;border-radius:10px;background:#f0f1f5;color:#50566a}
@media(max-width:520px){.app{padding:15px 12px 110px}.panel{padding:14px}.week-strip{gap:4px}.week-day{padding:8px 1px}.week-range{min-width:108px}.year-grid{grid-template-columns:repeat(2,1fr)}.calendar-cell{min-height:49px;padding:4px}.week-agenda{gap:3px}.week-column{padding:4px;min-height:90px}.week-column h3{font-size:9px}.week-event{font-size:9px;padding:4px}.tabs button{padding:7px 6px}.kanban{grid-template-columns:repeat(3,minmax(170px,1fr))}.category-filter{max-width:52%}}
</style></head>
<body>
<div class="app">
<header><div class="brand"><div class="brand-icon">✓</div> Планер</div><div class="avatar">Р</div></header>
<main>
<section class="view active" id="todayView">
<div class="heading"><p id="greeting" class="muted"></p><h1>План на день</h1></div>
<div class="panel"><div class="panel-head"><h2>Неделя</h2><div class="week-tools"><button class="icon-button" id="weekPrev">‹</button><span class="week-range" id="weekRange"></span><button class="icon-button" id="weekNext">›</button></div></div><div class="week-strip" id="weekStrip"></div></div>
<div class="panel"><div class="panel-head"><h2 id="selectedDateTitle">Задачи</h2><span class="muted" id="taskCount"></span></div><div class="today-tools"><div class="tabs" id="taskViewTabs"><button type="button" data-task-view="kanban" class="active">▦ Канбан</button><button type="button" data-task-view="list">☰ Список</button></div><select class="category-filter" id="categoryFilter" aria-label="Фильтр по категории"><option value="">Все категории</option></select></div><div class="task-list" id="taskList"></div><button class="add-button" id="addTask">＋ Добавить задачу</button><button class="secondary" id="addCategory" style="margin-top:9px;width:100%">＋ Создать категорию</button></div>
</section>
<section class="view" id="calendarView">
<div class="heading"><p class="muted">Планируй заранее</p><h1>Календарь</h1></div>
<div class="panel"><div class="panel-head"><div class="period-tools"><button class="icon-button" id="periodPrev">‹</button><strong id="periodTitle"></strong><button class="icon-button" id="periodNext">›</button></div><div class="tabs" id="calendarTabs"><button data-mode="day">День</button><button data-mode="week">Неделя</button><button data-mode="month" class="active">Месяц</button><button data-mode="year">Год</button></div></div><div id="calendarContent"></div></div>
<div class="panel"><div class="panel-head"><h2 id="calendarDayTitle">Задачи выбранного дня</h2><button class="primary" id="addCalendarTask">＋ Задача</button></div><div class="task-list" id="calendarTaskList"></div></div>
</section>
<section class="view" id="habitsView">
<div class="heading"><p class="muted">Маленькие шаги каждый день</p><h1>Привычки</h1></div>
<div class="panel"><div class="panel-head"><h2>На выбранный день</h2><button class="primary" id="addHabit">＋ Добавить</button></div><div id="habitList"></div></div>
</section>
</main></div>
<nav class="bottom-nav">
<button class="nav-button active" data-view="todayView"><span class="nav-icon">⌂</span><span>Сегодня</span></button>
<button class="nav-button" data-view="calendarView"><span class="nav-icon">▦</span><span>Календарь</span></button>
<button class="nav-button" data-view="habitsView"><span class="nav-icon">◉</span><span>Привычки</span></button>
</nav>
<div class="backdrop" id="taskModal"><form class="modal" id="taskForm">
<div class="modal-head"><h2 id="modalTitle">Новая задача</h2><button class="close-button" type="button" id="closeModal">×</button></div>
<div class="field"><label for="taskTitle">Заголовок</label><input id="taskTitle" maxlength="120" required placeholder="Что нужно сделать?"></div>
<div class="field"><label for="taskDescription">Описание</label><textarea id="taskDescription" rows="3" placeholder="Добавь подробности (необязательно)"></textarea></div>
<div class="form-row"><div class="field"><label for="taskPriority">Приоритет</label><select id="taskPriority"><option value="none">Без приоритета</option><option value="low">Низкий</option><option value="medium">Средний · синий + жёлтый</option><option value="high">Высокий</option></select></div><div class="field"><label for="taskCategory">Категория</label><select id="taskCategory"><option value="">Без категории</option></select></div></div>
<div class="form-row"><div class="field"><label for="taskDate">Дата</label><input id="taskDate" type="date"></div><div class="field"><label for="taskTime">Время</label><input id="taskTime" type="time"></div></div>
<div class="modal-actions"><button class="secondary" type="button" id="cancelModal">Отмена</button><button class="primary">Сохранить</button></div>
</form></div>
<script>
const today=new Date();today.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromISO=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const fmt=(d,o)=>new Intl.DateTimeFormat("ru-RU",o).format(d);
const weekdays=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
const key="planner-data-v3";
const initial={tasks:[
{id:1,title:"Позаниматься нидерландским",description:"",date:iso(today),time:"12:30",done:false},
{id:2,title:"Купить продукты",description:"",date:iso(today),time:"17:00",done:false},
{id:3,title:"Отправить документы",description:"Проверить все файлы",date:iso(addDays(today,1)),time:"09:30",done:false},
{id:4,title:"Запланировать поездку",description:"",date:iso(new Date(today.getFullYear()+1,today.getMonth(),today.getDate())),time:"",done:false}],
habits:[
{id:11,title:"Учить нидерландский",icon:"🇳🇱",days:[0,1,2,3,4,5,6],done:[]},
{id:12,title:"Читать 20 минут",icon:"📖",days:[0,1,2,3,4,5,6],done:[]},
{id:13,title:"Тренировка",icon:"🏋️",days:[0,2,4],done:[]}]};
let data;try{data=JSON.parse(localStorage.getItem(key))||initial}catch(e){data=initial}
data.categories=Array.isArray(data.categories)?data.categories:[];
data.habits=Array.isArray(data.habits)?data.habits:[];
data.tasks=(Array.isArray(data.tasks)?data.tasks:[]).map(t=>({...t,priority:["none","low","medium","high"].includes(t.priority)?t.priority:"none",category:t.category||"",status:t.status|| (t.done?"done":"todo")}));
let selectedDate=new Date(today),calendarDate=new Date(today),calendarMode="month",editingId=null,taskView="kanban",categoryFilter="";
function save(){localStorage.setItem(key,JSON.stringify(data))}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

// Генерируем короткий звук через браузер, без отдельного аудиофайла.
function clickSound(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=720;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.06,c.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.055);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06);o.onended=()=>c.close()}catch(e){}}

function renderWeek(){
 const start=mondayOf(selectedDate),end=addDays(start,6);
 document.getElementById("weekRange").textContent=fmt(start,{day:"numeric",month:"short"})+" — "+fmt(end,{day:"numeric",month:"short"});
 document.getElementById("weekStrip").innerHTML=Array.from({length:7},(_,i)=>{const d=addDays(start,i),s=iso(d);return '<button class="week-day '+(s===iso(selectedDate)?"selected":"")+'" data-week="'+s+'"><span class="dow">'+weekdays[i]+'</span><span class="num">'+d.getDate()+'</span></button>'}).join("");
 document.querySelectorAll("[data-week]").forEach(b=>b.onclick=()=>{selectedDate=fromISO(b.dataset.week);calendarDate=new Date(selectedDate);render()});
}
const statuses=[{id:"todo",label:"К выполнению"},{id:"doing",label:"В работе"},{id:"done",label:"Готово"}];
function priorityBadge(priority){const labels={low:"Низкий",medium:"Средний",high:"Высокий"};return priority&&priority!=="none"?'<span class="badge priority-'+priority+'">'+labels[priority]+'</span>':""}
function categoryBadge(category){return category?'<span class="badge">'+esc(category)+'</span>':""}
function renderCategoryOptions(){
 const filter=document.getElementById("categoryFilter"),select=document.getElementById("taskCategory");
 filter.innerHTML='<option value="">Все категории</option>'+data.categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");filter.value=categoryFilter;
 const current=select.value;select.innerHTML='<option value="">Без категории</option>'+data.categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");if(data.categories.includes(current))select.value=current;
}
function renderTasks(id,dateKey){
 const box=document.getElementById(id),isToday=id==="taskList";
 let list=data.tasks.filter(t=>t.date===dateKey&&(!isToday||!categoryFilter||t.category===categoryFilter)).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
 if(isToday&&taskView==="kanban"){
  box.className="kanban";
  box.innerHTML=statuses.map(st=>{const items=list.filter(t=>(t.status||(t.done?"done":"todo"))===st.id);return '<section class="kanban-column"><h3>'+st.label+'<span class="kanban-count">'+items.length+'</span></h3>'+items.map(t=>'<article class="kanban-card" data-edit="'+t.id+'"><span class="task-title '+(t.done?"":"")+'">'+esc(t.title)+'</span>'+(t.description?'<span class="task-description">'+esc(t.description)+'</span>':"")+'<div class="task-badges">'+priorityBadge(t.priority)+categoryBadge(t.category)+'</div><div class="kanban-meta"><span class="kanban-time">'+esc(t.time||"")+'</span><select aria-label="Статус задачи" data-status="'+t.id+'">'+statuses.map(x=>'<option value="'+x.id+'" '+(x.id===st.id?"selected":"")+'>'+x.label+'</option>').join("")+'</select></div></article>').join("")+(items.length?"":'<div class="muted">Пока пусто</div>')+'</section>'}).join("");
  box.querySelectorAll("[data-status]").forEach(sel=>sel.onchange=e=>{e.stopPropagation();const t=data.tasks.find(x=>x.id===Number(sel.dataset.status));if(t){t.status=sel.value;t.done=sel.value==="done";save();render()}});
  box.querySelectorAll("[data-edit]").forEach(card=>card.onclick=e=>{if(e.target.closest("select"))return;openModal(Number(card.dataset.edit))});
 }else{
  if(isToday)box.className="task-list";
  box.innerHTML=list.length?list.map(t=>'<div class="task-row '+(t.done?"done":"")+'" data-edit="'+t.id+'"><input class="task-check" type="checkbox" data-check="'+t.id+'" '+(t.done?"checked":"")+'><div class="task-copy"><span class="task-title">'+esc(t.title)+'</span>'+(t.description?'<span class="task-description">'+esc(t.description)+'</span>':"")+'<div class="task-badges">'+priorityBadge(t.priority)+categoryBadge(t.category)+'</div></div><span class="task-time">'+esc(t.time||"")+'</span></div>').join(""):'<div class="empty">На этот день задач пока нет.</div>';
  box.querySelectorAll("[data-check]").forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{const t=data.tasks.find(x=>x.id===Number(cb.dataset.check));if(t){t.done=cb.checked;t.status=t.done?"done":"todo";clickSound();save();render()}}});
  box.querySelectorAll("[data-edit]").forEach(row=>row.onclick=e=>{if(e.target.closest("[data-check]"))return;openModal(Number(row.dataset.edit))});
 }
 if(isToday){const done=list.filter(t=>t.done).length;document.getElementById("taskCount").textContent=list.length?done+" из "+list.length+" выполнено":""}
}

function renderHabits(){
 const day=(selectedDate.getDay()+6)%7,dateKey=iso(selectedDate),list=data.habits.filter(h=>h.days.includes(day));
 document.getElementById("habitList").innerHTML=list.length?list.map(h=>{const yes=h.done.includes(dateKey);return '<div class="habit-row"><span>'+h.icon+'</span><span class="habit-name">'+esc(h.title)+'</span><button class="habit-check '+(yes?"done":"")+'" data-habit="'+h.id+'">'+(yes?"✓":"○")+'</button></div>'}).join(""):'<div class="empty">На этот день привычек нет.</div>';
 document.querySelectorAll("[data-habit]").forEach(b=>b.onclick=()=>{const h=data.habits.find(x=>x.id===Number(b.dataset.habit));if(!h)return;h.done=h.done.includes(dateKey)?h.done.filter(x=>x!==dateKey):h.done.concat(dateKey);save();render()});
}
function renderCalendar(){
 const box=document.getElementById("calendarContent"),title=document.getElementById("periodTitle"),y=calendarDate.getFullYear(),m=calendarDate.getMonth();
 title.textContent=calendarMode==="year"?String(y):fmt(calendarDate,{month:"long",year:"numeric"});
 document.querySelectorAll("#calendarTabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===calendarMode));
 if(calendarMode==="day"){box.innerHTML='<div class="empty">'+fmt(calendarDate,{weekday:"long",day:"numeric",month:"long"})+'</div>';return}
 if(calendarMode==="year"){
  box.innerHTML='<div class="year-grid">'+Array.from({length:12},(_,i)=>'<button class="year-month" data-month="'+i+'"><strong>'+fmt(new Date(y,i,1),{month:"long"})+'</strong><span>Открыть месяц →</span></button>').join("")+'</div>';
  box.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{calendarDate.setMonth(Number(b.dataset.month));calendarMode="month";renderCalendar()});return
 }
 if(calendarMode==="week"){
  const start=mondayOf(calendarDate);box.innerHTML='<div class="week-agenda">'+Array.from({length:7},(_,i)=>{const d=addDays(start,i),ls=data.tasks.filter(t=>t.date===iso(d));return '<div class="week-column '+(iso(d)===iso(today)?"today":"")+'"><h3>'+weekdays[i]+" "+d.getDate()+'</h3>'+ls.map(t=>'<div class="week-event">'+esc(t.title)+'</div>').join("")+'</div>'}).join("")+'</div>';return
 }
 const first=new Date(y,m,1),start=mondayOf(first),count=new Date(y,m+1,0).getDate(),cells=Math.ceil(((first.getDay()+6)%7+count)/7)*7;
 box.innerHTML='<div class="calendar-grid">'+weekdays.map(d=>'<div class="calendar-weekday">'+d+'</div>').join("")+Array.from({length:cells},(_,i)=>{const d=addDays(start,i),s=iso(d),ls=data.tasks.filter(t=>t.date===s);let c="calendar-cell";if(d.getMonth()!==m)c+=" other";if(s===iso(today))c+=" today";if(s===iso(selectedDate))c+=" selected";return '<button class="'+c+'" data-date="'+s+'">'+d.getDate()+(ls.length?'<small>'+ls.length+' задач</small>':"")+'</button>'}).join("")+'</div>';
 box.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selectedDate=fromISO(b.dataset.date);calendarDate=new Date(selectedDate);render()});
}
function render(){
 const title="Задачи · "+fmt(selectedDate,{day:"numeric",month:"long"});
 document.getElementById("greeting").textContent=fmt(selectedDate,{weekday:"long",day:"numeric",month:"long"});
 document.getElementById("selectedDateTitle").textContent=title;
 document.getElementById("calendarDayTitle").textContent=title;
 renderWeek();renderCategoryOptions();renderTasks("taskList",iso(selectedDate));renderTasks("calendarTaskList",iso(selectedDate));renderHabits();renderCalendar();
}
function openModal(id){
 editingId=id===undefined?null:id;const t=editingId===null?null:data.tasks.find(x=>x.id===editingId);
 document.getElementById("modalTitle").textContent=t?"Редактировать задачу":"Новая задача";
 document.getElementById("taskTitle").value=t?t.title:"";
 document.getElementById("taskDescription").value=t?t.description||"":"";
 document.getElementById("taskDate").value=t?t.date:iso(selectedDate);
 document.getElementById("taskTime").value=t?t.time||"":"";
 renderCategoryOptions();document.getElementById("taskPriority").value=t?t.priority||"none":"none";document.getElementById("taskCategory").value=t?t.category||"":"";
 document.getElementById("taskModal").classList.add("open");document.getElementById("taskTitle").focus();
}
function closeModal(){document.getElementById("taskModal").classList.remove("open")}
document.getElementById("addTask").onclick=()=>openModal();
document.getElementById("addCategory").onclick=()=>{const name=prompt("Название новой категории:");if(!name||!name.trim())return;const value=name.trim();if(data.categories.some(c=>c.toLocaleLowerCase()===value.toLocaleLowerCase())){alert("Такая категория уже есть.");return}data.categories.push(value);categoryFilter=value;save();renderCategoryOptions();render()};
document.getElementById("categoryFilter").onchange=e=>{categoryFilter=e.target.value;render()};
document.getElementById("taskViewTabs").onclick=e=>{const b=e.target.closest("[data-task-view]");if(!b)return;taskView=b.dataset.taskView;document.querySelectorAll("#taskViewTabs button").forEach(x=>x.classList.toggle("active",x===b));render()};
document.getElementById("addCalendarTask").onclick=()=>openModal();
document.getElementById("closeModal").onclick=closeModal;
document.getElementById("cancelModal").onclick=closeModal;
document.getElementById("taskModal").onclick=e=>{if(e.target.id==="taskModal")closeModal()};
document.getElementById("taskForm").onsubmit=e=>{
 e.preventDefault();const previous=editingId===null?null:data.tasks.find(t=>t.id===editingId);const task={id:editingId===null?Date.now():editingId,title:document.getElementById("taskTitle").value.trim(),description:document.getElementById("taskDescription").value.trim(),date:document.getElementById("taskDate").value,time:document.getElementById("taskTime").value,priority:document.getElementById("taskPriority").value,category:document.getElementById("taskCategory").value,done:previous?previous.done:false,status:previous?previous.status:("todo")};
 if(editingId===null)data.tasks.push(task);else data.tasks=data.tasks.map(t=>t.id===editingId?task:t);
 selectedDate=fromISO(task.date);calendarDate=new Date(selectedDate);save();closeModal();render();
};
document.getElementById("addHabit").onclick=()=>{const name=prompt("Какую привычку добавить?");if(!name||!name.trim())return;data.habits.push({id:Date.now(),title:name.trim(),icon:"✨",days:[0,1,2,3,4,5,6],done:[]});save();render()};
document.getElementById("weekPrev").onclick=()=>{selectedDate=addDays(selectedDate,-7);calendarDate=new Date(selectedDate);render()};
document.getElementById("weekNext").onclick=()=>{selectedDate=addDays(selectedDate,7);calendarDate=new Date(selectedDate);render()};
document.getElementById("calendarTabs").onclick=e=>{const b=e.target.closest("[data-mode]");if(b){calendarMode=b.dataset.mode;renderCalendar()}};
document.getElementById("periodPrev").onclick=()=>{if(calendarMode==="year")calendarDate.setFullYear(calendarDate.getFullYear()-1);else if(calendarMode==="week")calendarDate=addDays(calendarDate,-7);else if(calendarMode==="day")calendarDate=addDays(calendarDate,-1);else calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};
document.getElementById("periodNext").onclick=()=>{if(calendarMode==="year")calendarDate.setFullYear(calendarDate.getFullYear()+1);else if(calendarMode==="week")calendarDate=addDays(calendarDate,7);else if(calendarMode==="day")calendarDate=addDays(calendarDate,1);else calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};
document.querySelectorAll(".nav-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.view).classList.add("active")});
render();
</script></body></html>
