px;}
</style>
</head>
<body>
<div class="app">
    <!-- Шапка приложения -->
    <header>
        <div class="brand">
            <div class="brand-icon">✓</div>
            Pro Plan
        </div>
        <div class="avatar">А</div>
    </header>

    <main>
        <!-- Экран "Сегодня" -->
        <div id="todayView" class="view active">
            <div class="heading">
                <h1>Сегодня</h1>
                <p>6 октября, Вторник</p>
            </div>
            
            <div class="home-tabs">
                <button aria-selected="true">Задачи (2)</button>
                <button aria-selected="false">Привычки (1)</button>
            </div>

            <div class="today-groups" style="margin-top: 20px;">
                <div class="task-group">
                    <div class="task-group-title">В работе <span>2</span></div>
                    <div class="task-list">
                        <!-- Задача 1 -->
                        <div class="task-row">
                            <input type="checkbox" class="task-check" />
                            <div class="task-copy">
                                <span class="task-title">Проверить макеты</span>
                                <span class="task-description">Сверить отступы и цвета</span>
                            </div>
                            <span class="task-time">14:00</span>
                        </div>
                        <!-- Задача 2 -->
                        <div class="task-row">
                            <input type="checkbox" class="task-check" />
                            <div class="task-copy">
                                <span class="task-title">Созвон с командой</span>
                            </div>
                            <span class="task-time">16:30</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Плавающая кнопка добавления -->
            <button class="floating-add" onclick="openModal('taskModal')">+</button>
        </div>

        <!-- Экран "Привычки" -->
        <div id="habitsView" class="view">
            <div class="heading">
                <h1>Привычки</h1>
                <p>Трекинг на сегодня</p>
            </div>
            
            <div id="todayHabitList" style="margin-top:20px;">
                <button class="habit-open" onclick="openModal('habitModal')">
                    <div class="habit-row">
                        <div class="habit-name">Выпить 2 литра воды</div>
                        <div class="habit-check">💧</div>
                    </div>
                </button>
            </div>
        </div>
    </main>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav">
        <button class="nav-button active" onclick="switchTab('todayView', this)">
            <span class="nav-icon">📅</span>
            Сегодня
        </button>
        <button class="nav-button" onclick="switchTab('habitsView', this)">
            <span class="nav-icon">⭐</span>
            Привычки
        </button>
        <button class="nav-button" onclick="window.Telegram.WebApp.showAlert('Настройки в разработке')">
            <span class="nav-icon">⚙️</span>
            Настройки
        </button>
    </nav>
</div>

<!-- Модальное окно добавления задачи -->
<div id="taskModal" class="backdrop">
    <div class="modal">
        <div class="modal-head">
            <h2>Новая задача</h2>
            <button class="close-button" onclick="closeModal('taskModal')">✕</button>
        </div>
        <div class="field">
            <label>Название</label>
            <input type="text" placeholder="Что нужно сделать?" id="taskInput">
        </div>
        <div class="modal-actions">
            <button class="secondary" onclick="closeModal('taskModal')">Отмена</button>
            <button class="primary" onclick="saveTask()">Добавить</button>
        </div>
    </div>
</div>

<!-- Модальное окно привычки (со свайпером) -->
<div id="habitModal" class="backdrop">
    <div class="habit-sheet">
        <div class="habit-top">
            <button class="habit-back" onclick="closeModal('habitModal')">✕</button>
            <span class="habit-date">Сегодня</span>
        </div>
        <div id="habitMain">
            <h2 class="habit-detail-title">Выпить 2 литра воды</h2>
            <div class="habit-success-mark" style="font-size: 60px;">✅</div>
            
            <div id="habitSwipeArea">
                <div class="habit-swipe-hint">Свайпни вправо, чтобы выполнить</div>
                <div class="habit-slider">
                    <span>> > ></span>
                    <div class="habit-thumb">
                        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем приложение на весь экран телефона
    
    // Подстраиваем цвета под тему пользователя в Telegram (светлая/темная)
    if (tg.themeParams.bg_color) {
        document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color);
        document.documentElement.style.setProperty('--card', tg.themeParams.secondary_bg_color || '#fff');
        document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#000');
    }

    // 2. НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ
    function switchTab(viewId, btnElement) {
        // Скрываем все экраны
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
        
        // Показываем нужный
        document.getElementById(viewId).classList.add('active');
        btnElement.classList.add('active');
        
        tg.HapticFeedback.selectionChanged(); // Легкая системная вибрация (iOS/Android)
    }

    // 3. УПРАВЛЕНИЕ МОДАЛЬНЫМИ ОКНАМИ
    function openModal(id) {
        document.getElementById(id).classList.add('open');
        tg.HapticFeedback.impactOccurred('light');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('open');
    }

    function saveTask() {
        const input = document.getElementById('taskInput');
        if(input.value.trim() !== '') {
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('Успех! Задача "' + input.value + '" сохранена.');
            input.value = '';
            closeModal('taskModal');
        }
    }

    // 4. ЛОГИКА СВАЙПА ПРИВЫЧКИ (DRAG & DROP)
    const thumb = document.querySelector('.habit-thumb');
    const slider = document.querySelector('.habit-slider');
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    
    // Касание
    thumb.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].clientX - currentX;
        thumb.classList.add('dragging');
    }, {passive: true});

    // Движение пальцем
    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let maxX = slider.offsetWidth - thumb.offsetWidth - 8; // 8px отступы
        currentX = e.touches[0].clientX - startX;
        
        // Ограничиваем свайп рамками слайдера
        if (currentX < 0) currentX = 0;
        if (currentX > maxX) currentX = maxX;
        
        thumb.style.setProperty('--slide-x', `${currentX}px`);
    }, {passive: true});

    // Отпускание пальца
    document.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        thumb.classList.remove('dragging');
        
        let maxX = slider.offsetWidth - thumb.offsetWidth - 8;
        
        // Если свайпнули больше чем на 75% — засчитываем выполнение
        if (currentX > maxX * 0.75) {
            currentX = maxX;
            document.querySelector('.habit-success-mark').style.opacity = '1';
            tg.HapticFeedback.notificationOccurred('success'); // Вибрация успеха
            
            // Закрываем окно через секунду после успешного свайпа
            setTimeout(() => {
                closeModal('habitModal');
                currentX = 0;
                thumb.style.setProperty('--slide-x', `0px`);
                document.querySelector('.habit-success-mark').style.opacity = '0';
            }, 1200);
        } else {
            // Если не дотянули — возвращаем ползунок назад
            currentX = 0; 
            tg.HapticFeedback.impactOccurred('light');
        }
        thumb.style.setProperty('--slide-x', `${currentX}px`);
    });
</script>
</body>
</html>
